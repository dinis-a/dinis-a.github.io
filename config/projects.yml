HEADER:
  label: "Portfolio"

PROJECTS:
  - title: "Natural Language SQL Generator"
    category: "RAG"
    description: |
      <br>A web app that enables non-SQL users to perform data analytics through natural language questions. 
      Data is ingested from HDFS via PySpark and Airflow into ClickHouse, while ChromaDB stores table schemas 
      and relevant SQL scripts as vector embeddings. 
      User queries trigger context retrieval from ChromaDB, which is then passed to a locally deployed Qwen LLM 
      to generate SQL. The result is executed in ClickHouse and returned to the web UI.<br><br>
      Stack: Python, PySpark, Airflow, ClickHouse, ChromaDB, Flask, Redis, Postgres, Docker, Nginx.<br><br>
    image: "config/assets/projects/sqlfree.jpg"
    url: "mailto:akulov.dinis@gmal.com?subject=Repository%20Access%20Request&body=Hi,%20Dinis!%0A%0ACould%20you%20please%20share%20the%20code%20from%20the%20project%20%22Natural%20Language%20SQL%20Generator%22%3F%0A%0AThank%20you!"
  - title: "QLoRA Text-to-SQL"
    category: "LLM Tools"
    description: |
      <br>Fine-tune a 7B-parameter LLM for Text-to-SQL on the Spider dataset using QLoRA — fits on a free T4 GPU.
      Clean Python package with lazy loading, data loaders, prompt formatting, and evaluation metrics.
      Includes Kaggle notebook with MLflow checkpointing and HuggingFace Hub upload.<br><br>
      Stack: Python, PyTorch, HuggingFace PEFT, bitsandbytes, Spider dataset.<br><br>
    image: "config/assets/projects/qlora.jpg"
    url: "https://github.com/dinis-a/qlora-text2sql"
  - title: "Skin Cancer CNN Classifier"
    category: "CV"
    description: |
      <br>A CNN for classifying dermoscopic images into 9 skin lesion categories using EfficientNet-B0 transfer learning.
      Trained on the ISIC dataset with class weights and heavy augmentation. Comes with a FastAPI inference server,
      Docker support, and a Kaggle notebook with MLflow experiment tracking and GradCAM visualizations.<br><br>
      Stack: Python, PyTorch, FastAPI, Docker, MLflow, EfficientNet.<br><br>
    image: "config/assets/projects/skin-cnn.jpg"
    url: "https://github.com/dinis-a/skin-cancer-cnn"
  - title: "JSON Repair Engine"
    category: "LLM Tools"
    description: |
      <br>A JSON repair engine built for LLM-generated output. Fixes trailing commas, Python literals (True/False/None), unquoted keys, single quotes, comments, missing/extra commas, and unterminated structures. Returns structured diagnostics with confidence scoring.<br><br>
      Install: <code>pip install json-repair-engine</code><br>
      Stack: Python, zero dependencies.<br><br>
    image: "config/assets/projects/json-repair.jpg"
    url: "https://pypi.org/project/json-repair-engine/"
  - title: "Skin Cancer Detection via Photo"
    category: "CV"
    description: |
      <br>A PyTorch-powered Telegram bot that analyzes user-uploaded skin photos and returns diagnostic predictions. 
      Built with aiogram, Dockerized for easy deployment.<br><br>
      Stack: Python, PyTorch, aiogram, Pillow, NumPy, Docker.<br><br>
    image: "config/assets/projects/melanoma.jpg"
    url: "https://github.com/dinis-a/skin_ai"
  - title: "Chinese Shorts Generator"
    category: "LLM Apps"
    description: |
      <br>An automated video creation tool that generates YouTube Shorts for Chinese language learning. 
      Combines text-to-speech (gTTS), pinyin romanization, and video editing (MoviePy) 
      to produce engaging educational content with automatic YouTube uploads via YouTube API.<br><br>
      Stack: Python, MoviePy, gTTS, YouTube API, PostgreSQL, Google Gemini API, Docker.<br><br>
    image: "config/assets/projects/youtube.jpg"
    url: "https://www.youtube.com/@prosto_kitayskiy/shorts"
  - title: "AI Assistant Chatbot"
    category: "LLM Apps"
    description: |
      <br>A Telegram bot that provides access to Google's Gemini AI models directly in your chat. 
      Supports multi-turn conversations, model switching, and markdown formatting. 
      Built with aiogram, google-generativeai, and includes smart message splitting for long responses.<br><br>
      Stack: Python, aiogram, Gemini API, Docker.<br><br>
    image: "config/assets/projects/gemini.jpg"
    url: "https://github.com/dinis-a/gemini_telegram_bot"
  - title: "Stylometric AI Text Detector"
    category: "NLP"
    description: |
      <br>A Python package that tells AI-generated text from human-written text using 8 stylometric features
      (character, word and sentence statistics, punctuation, capitalization) and a Random Forest classifier.
      Trained on ~487k labeled texts, it reaches 96% accuracy on a held-out test split; the model is pulled from
      the Hugging Face Hub on first use.<br><br>
      Install: <code>pip install stylometric-ai-detector</code><br>
      Stack: Python, scikit-learn, Hugging Face Hub, pytest, GitHub Actions.<br><br>
    image: "config/assets/projects/stylometric-ai-detector.jpg"
    url: "https://pypi.org/project/stylometric-ai-detector/"
  - title: "Russian Stylometry Toolkit"
    category: "NLP"
    description: |
      <br>An interpretable toolkit for detecting machine-generated Russian text: 66 stylometric features (typography,
      lexicon, syntax, pymorphy3 morphology), a scikit-learn-compatible vectorizer, a CLI, and a classifier that
      explains every decision. Reaches 0.883 accuracy on a topic-disjoint LLMTrace test split (0.751 for the
      8-feature baseline) with a 1.2 MB model that runs on CPU.<br><br>
      Transformers: fine-tuned rubert-base-cased (178M parameters, 238k texts) to 0.953 accuracy and compared it
      with a BERT + stylometry hybrid and a stacking ensemble. Adding the 66 features to the
      transformer's outputs gives 1.4–2.6 points of macro-F1 for attributing a text to a human or one of 14 LLM
      families.<br><br>
      Install: <code>pip install ru-stylometry</code><br>
      Stack: Python, PyTorch, Hugging Face Transformers, scikit-learn, pymorphy3, pytest, GitHub Actions.<br><br>
    image: "config/assets/projects/ru-stylometry.jpg"
    url: "https://pypi.org/project/ru-stylometry/"